<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src http://127.0.0.1:*; img-src 'self' data:;" />
  <title>APE Desktop</title>
  <link rel="stylesheet" href="core/theme.css" />
</head>
<body>
  <div id="app">
