<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Product Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
--bg0:#F1EFE8;--bg1:#FFFFFF;--bg2:#F7F6F3;--inset:#F1EFE8;
--ink1:#1A1A1A;--ink2:#5F5E5A;--ink3:#75736B;
--accent:#534AB7;--accent-bg:rgba(83,74,183,.09);--accent-hover:#453DA0;
--ok:#3B6D11;--ok-bg:#EAF3DE;--warn:#854F0B;--warn-bg:#FAEEDA;--crit:#A32D2D;--crit-bg:#FCEBEB;
--b1:rgba(0,0,0,.10);--b2:rgba(0,0,0,.17);
--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
--mono:'JetBrains Mono',ui-monospace,monospace;
}
[data-theme="dark"]{
--bg0:#14171C;--bg1:#1A1F27;--bg2:#232A36;--inset:#0E1116;
--ink1:#E8EAED;--ink2:#A7B0BC;--ink3:#8A94A0;
--accent:#8B82F0;--accent-bg:rgba(139,130,240,.15);--accent-hover:#A19AF5;
--ok:#7BC86B;--ok-bg:rgba(123,200,107,.15);--warn:#E5B567;--warn-bg:rgba(229,181,103,.15);--crit:#F0888B;--crit-bg:rgba(240,136,139,.15);
--b1:rgba(255,255,255,.09);--b2:rgba(255,255,255,.17);
--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;font-family:Geist,Inter,system-ui,-apple-system,sans-serif;background:var(--bg0);color:var(--ink1);font-size:13.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none}a:hover{color:var(--accent-hover);text-decoration:underline}
button,input,textarea,select{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.hidden{display:none!important}
.mono{font-family:var(--mono)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes shimmer{100%{background-position:-100% 0}}
.sk{border-radius:8px;background:linear-gradient(90deg,var(--bg2) 25%,var(--inset) 37%,var(--bg2) 63%);background-size:200% 100%;animation:shimmer 1.2s ease-in-out infinite;animation-direction:reverse}
.sk-card{background:var(--bg1);border:1px solid var(--b1);border-radius:14px;box-shadow:var(--shadow);padding:20px;margin-bottom:14px}
.empty{text-align:center;padding:30px 20px;color:var(--ink3)}
.empty .ei{width:40px;height:40px;margin:0 auto 10px;color:var(--ink3);opacity:.7}
/* топ-бар */
.topbar{position:sticky;top:0;z-index:40;height:56px;background:var(--bg1);border-bottom:1px solid var(--b1);backdrop-filter:blur(8px)}
.tbin{max-width:1200px;margin:0 auto;height:56px;padding:0 20px;display:flex;align-items:center;gap:12px}
.iconbtn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:1px solid var(--b1);border-radius:8px;background:var(--bg1);color:var(--ink2);cursor:pointer;transition:.15s}
.iconbtn:hover{background:var(--bg2);color:var(--ink1)}
.avatar{width:28px;height:28px;border-radius:999px;background:var(--accent-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600}
.logoutbtn{height:32px;padding:0 12px;border:1px solid var(--b1);border-radius:8px;background:var(--bg1);color:var(--ink2);font-size:12px;font-weight:500;cursor:pointer;transition:.15s}
.logoutbtn:hover{background:var(--bg2);color:var(--ink1)}
.menubtn{display:none}
/* каркас */
.shell{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:216px 1fr;align-items:start}
.side{position:sticky;top:56px;padding:20px 12px;display:flex;flex-direction:column;gap:2px;height:calc(100vh - 56px);border-right:1px solid var(--b1);overflow-y:auto;background:var(--bg0)}
.grp{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3);font-family:var(--mono);padding:8px 10px 4px}
.grp.mt{padding-top:14px}
.navitem{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border:0;border-radius:8px;font-size:13.5px;font-weight:500;cursor:pointer;transition:.15s;text-align:left;background:transparent;color:var(--ink2);width:100%}
.navitem:hover{background:var(--bg2)}
.navitem.active{background:var(--accent-bg);color:var(--accent)}
.navbadge{margin-left:auto;font-size:10.5px;font-weight:600;font-family:var(--mono);border-radius:999px;padding:2px 7px}
.quota{margin-top:auto;padding:10px;border-radius:10px;background:var(--bg2);font-size:11.5px;color:var(--ink2);line-height:1.45}
main{padding:28px;min-width:0}
/* компоненты */
.card{background:var(--bg1);border:1px solid var(--b1);border-radius:14px;box-shadow:var(--shadow);padding:20px;margin-bottom:14px}
h2{font-size:22px;font-weight:600;margin:0 0 16px}
.t18{font-size:18px;font-weight:600}
.caps{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--ink3);font-family:var(--mono)}
.sub{font-size:13.5px;color:var(--ink2)}
.faint{font-size:12px;color:var(--ink3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--b2);background:var(--bg1);color:var(--ink1);font-size:13.5px;font-weight:500;cursor:pointer;transition:.15s}
.btn:hover{background:var(--bg2)}
.btn.primary{border-color:var(--accent);background:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent-hover)}
.btn.sm{height:32px;padding:0 12px;font-size:12px}
.chip{font-size:11px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap;display:inline-block}
.tile{background:var(--bg1);border:1px solid var(--b1);border-radius:14px;box-shadow:var(--shadow);padding:16px}
.tile .l{font-size:11.5px;color:var(--ink2);margin-bottom:6px}
.tile .v{font-family:var(--mono);font-size:23px;font-weight:700}
.tile .m{font-size:11px;color:var(--ink3);margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:14px}
.inp{height:40px;padding:0 12px;border:1px solid var(--b2);border-radius:10px;background:var(--inset);color:var(--ink1);font-size:13.5px;width:100%}
.inp.mono{font-family:var(--mono)}
.ta{padding:10px 12px;border:1px solid var(--b2);border-radius:10px;background:var(--inset);color:var(--ink1);font-size:13.5px;width:100%;resize:vertical}
.sel{height:40px;padding:0 10px;border:1px solid var(--b2);border-radius:10px;background:var(--inset);color:var(--ink1);font-size:13.5px;width:100%}
.lbl{font-size:11.5px;font-weight:500;color:var(--ink2);display:block}
.ie{width:100%;height:32px;padding:0 8px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--ink1);font-size:13px}
.ie:hover{border-color:var(--b1);background:var(--bg2)}.ie:focus{background:var(--inset);border-color:var(--accent);outline:none}
.dz{border:2px dashed var(--b2);background:transparent;border-radius:14px;padding:24px;text-align:center;cursor:pointer;transition:.15s;margin-bottom:14px}
.dz.over{border-color:var(--accent);background:var(--accent-bg)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead tr{background:var(--bg2)}
th{text-align:left;padding:8px 12px;font-size:12px;font-weight:500;color:var(--ink2)}
th:first-child{border-radius:8px 0 0 8px}th:last-child{border-radius:0 8px 8px 0}
td{padding:10px 12px;border-bottom:1px solid var(--b1)}
.pbar{height:8px;border-radius:999px;background:var(--inset);overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.subbar{display:flex;gap:4px;flex-wrap:wrap;padding:4px;background:var(--bg2);border-radius:10px;margin-bottom:14px}
.subtab{height:32px;padding:0 12px;border:0;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;transition:.15s;background:transparent;color:var(--ink2)}
.subtab.active{background:var(--bg1);color:var(--ink1)}
.subtab:not(.active):hover{color:var(--ink1)}
.modalbg{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px}
.modal{width:100%;max-width:460px;background:var(--bg1);border-radius:14px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.28);animation:toastIn .2s ease-out}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:999px;background:var(--ink1);color:var(--bg1);font-size:13.5px;font-weight:500;box-shadow:0 12px 32px rgba(0,0,0,.25);animation:toastIn .2s ease-out}
.view{animation:fadeUp .3s ease-out}
/* логин */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.lcard{background:var(--bg1);border:1px solid var(--b1);border-radius:14px;box-shadow:var(--shadow);padding:32px;width:400px;max-width:100%}
/* мобилка */
@media(max-width:860px){.shell{grid-template-columns:180px 1fr}main{padding:22px 18px}}
@media(max-width:720px){
.menubtn{display:flex}
.shell{display:block}
.side{position:fixed;top:56px;left:0;right:0;width:auto;height:auto;max-height:74vh;border-right:0;border-bottom:1px solid var(--b1);background:var(--bg1);box-shadow:0 14px 28px rgba(0,0,0,.28);z-index:25;display:none}
.side.open{display:flex}
main{padding:18px 14px 60px}
.grid2{grid-template-columns:1fr!important}
}
</style>
</head>
<body>

<!-- Логин -->
<div id="login" class="hidden">
  <div class="lcard">
    <div style="display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:6px">
      <svg width="34" height="34" viewBox="0 0 48 48"><rect width="48" height="48" rx="14" fill="var(--bg2)"/><g stroke="var(--accent)" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14 36 24 12l10 24"/><path d="M17.6 27.5h12.8"/></g><circle cx="24" cy="12" r="4.2" fill="var(--accent)"/><circle cx="14" cy="36" r="3.6" fill="var(--bg2)" stroke="var(--accent)" stroke-width="2.6"/><circle cx="34" cy="36" r="3.6" fill="var(--bg2)" stroke="var(--accent)" stroke-width="2.6"/></svg>
    </div>
    <div style="text-align:center;font-family:var(--mono);font-size:13px;color:var(--accent)">engineer-ai.pro</div>
    <h1 style="font-size:20px;font-weight:600;text-align:center;margin:8px 0 4px">AI Product Engineer</h1>
    <p style="text-align:center;color:var(--ink2);font-size:13px;margin:0 0 22px">Соколенко М.В. · РУТ (МИИТ) · единый вход</p>
    <button class="btn primary" style="width:100%" id="btnGithub">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      Продолжить с GitHub</button>
    <div style="display:flex;align-items:center;gap:12px;color:var(--ink3);font-size:12px;margin:16px 0"><span style="flex:1;height:1px;background:var(--b1)"></span>или<span style="flex:1;height:1px;background:var(--b1)"></span></div>
    <button class="btn" style="width:100%" id="btnLogin">Вход по логину</button>
    <p style="color:var(--ink3);font-size:11.5px;text-align:center;margin-top:18px">Входя, ты соглашаешься с правилами курса.</p>
  </div>
</div>

<!-- Приложение -->
<div id="app" class="hidden">
  <header class="topbar"><div class="tbin">
    <button class="iconbtn menubtn" id="menuBtn" aria-label="Меню"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <div style="display:flex;align-items:center;gap:10px">
      <svg width="28" height="28" viewBox="0 0 48 48" role="img" aria-label="AI Product Engineer"><rect width="48" height="48" rx="14" fill="var(--bg2)"/><g stroke="var(--accent)" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14 36 24 12l10 24"/><path d="M17.6 27.5h12.8"/></g><circle cx="24" cy="12" r="4.2" fill="var(--accent)"/><circle cx="14" cy="36" r="3.6" fill="var(--bg2)" stroke="var(--accent)" stroke-width="2.6"/><circle cx="34" cy="36" r="3.6" fill="var(--bg2)" stroke="var(--accent)" stroke-width="2.6"/></svg>
      <div style="display:flex;flex-direction:column;line-height:1.15">
        <span style="font-size:13.5px;font-weight:600">AI Product Engineer</span>
        <span style="font-size:11px;color:var(--ink3);font-family:var(--mono)">engineer-ai.pro</span>
      </div>
    </div>
    <div style="flex:1"></div>
    <button class="iconbtn" id="btnTheme" aria-label="Переключить тему"></button>
    <div style="display:flex;align-items:center;gap:8px;padding-left:12px;border-left:1px solid var(--b1)">
      <div class="avatar" id="uAv"></div>
      <div style="display:flex;flex-direction:column;line-height:1.15">
        <span style="font-size:12px;font-weight:500" id="uName"></span>
        <span style="font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px;font-weight:600;font-family:var(--mono)" id="uRole"></span>
      </div>
    </div>
    <button class="logoutbtn" id="btnLogout">Выйти</button>
  </div></header>
  <div class="shell">
    <nav class="side" id="side" aria-label="Разделы"></nav>
    <main id="view"></main>
  </div>
  <div id="modalHost"></div>
  <div id="toastHost"></div>
</div>

<script>
const KC="https://auth.engineer-ai.pro/realms/ai-product-engineer/protocol/openid-connect";
const CLIENT="portal", REDIRECT=location.origin+"/";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const fmtN=n=>{n=Number(n||0);return n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?(n/1e3).toFixed(0)+"k":String(n);};
const mb=b=>(b/1048576).toFixed(1);
const ragCollection=()=>"ape_stu_"+String((CLAIMS.preferred_username||CLAIMS.sub||"me")).toLowerCase().replace(/[^a-z0-9_]/g,"_").slice(0,32);
const chip=(bg,fg,txt)=>`<span class="chip" style="background:${bg};color:${fg}">${esc(txt)}</span>`;
const CH={done:['var(--ok-bg)','var(--ok)'],doing:['var(--warn-bg)','var(--warn)'],todo:['var(--bg2)','var(--ink2)'],risk:['var(--crit-bg)','var(--crit)'],info:['var(--accent-bg)','var(--accent)']};

// ── Иконки (одноцветные, из дизайна) ──
const IC={
 home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',
 lectures:'<path d="M2 8.5 12 4l10 4.5-10 4.5z"/><path d="M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/>',
 homework:'<path d="M9 4h6v3H9z"/><path d="M15 5.5h3V21H6V5.5h3"/><path d="m9.5 13 2 2 3.5-3.5"/>',
 project:'<path d="M12 3c3.5 2 5.5 5.5 5.5 9.5L12 18l-5.5-5.5C6.5 8.5 8.5 5 12 3z"/><circle cx="12" cy="10.5" r="1.8"/><path d="M8.5 18.5 7 21m8.5-2.5L17 21"/>',
 grades:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
 community:'<circle cx="9" cy="8" r="3"/><path d="M3 19c0-3 2.7-5 6-5s6 2 6 5"/><path d="M16 5.5a3 3 0 0 1 0 5.5M17 14c2.4.5 4 2.4 4 5"/>',
 cabinet:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.4-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 4a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.8 1.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 11a2 2 0 1 1 0 4 1.7 1.7 0 0 0-1.6 0z"/>',
 admin:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>',
 moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
 up:'<path d="M12 16V4m0 0L8 8m4-4 4 4"/><path d="M4 16v3h16v-3"/>',
 copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>',
 chev:'<path d="m6 9 6 6 6-6"/>'
};
const ic=(n,s=17,st=1.8,color='')=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${color||'currentColor'}" stroke-width="${st}" stroke-linecap="round" stroke-linejoin="round">${IC[n]||''}</svg>`;

// ── Тема ──
function curTheme(){const s=localStorage.getItem('theme');if(s)return s;return (window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light';}
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);const b=$("btnTheme");if(b)b.innerHTML=ic(t==='dark'?'sun':'moon',17);}
function toggleTheme(){const t=curTheme()==='dark'?'light':'dark';localStorage.setItem('theme',t);applyTheme(t);}
applyTheme(curTheme());

// ── OIDC PKCE ──
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const rnd=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return b64(a)};
const chal=async v=>b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
const jwtp=t=>{try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))}catch{return{}}};
const expd=t=>{const p=jwtp(t);return !p.exp||p.exp*1000<Date.now()+5000};
let TOKEN=null, CLAIMS={}, ROLES=[];
async function login(idp){
  const v=rnd(48);sessionStorage.setItem('pkce',v);const st=rnd(16);sessionStorage.setItem('st',st);
  const p=new URLSearchParams({client_id:CLIENT,response_type:'code',scope:'openid',redirect_uri:REDIRECT,state:st,code_challenge:await chal(v),code_challenge_method:'S256'});
  if(idp)p.set('kc_idp_hint',idp);location.href=KC+"/auth?"+p;
}
async function exchange(code,st){
  if(st!==sessionStorage.getItem('st'))return showLogin();
  const body=new URLSearchParams({grant_type:'authorization_code',client_id:CLIENT,code,redirect_uri:REDIRECT,code_verifier:sessionStorage.getItem('pkce')||''});
  try{const r=await fetch(KC+"/token",{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});const d=await r.json();
    if(d.access_token){sessionStorage.setItem('tok',d.access_token);if(d.id_token)sessionStorage.setItem('idt',d.id_token);history.replaceState({},'',REDIRECT);boot(d.access_token);}else showLogin();
  }catch{showLogin()}
}
async function api(path,opts={}){

function partnerNameById(pid){if(pid==null)return "—";const p=(_adm.partners||[]).find(p=>String(p.id)===String(pid));return p?p.name:"—";}
async function saveMeta(sid){const pv=$("pt_"+sid).value.trim();const p=(_adm.partners||[]).find(p=>p.name===pv);

function admKt(){

    const avg=sc.length?(sc.reduce((x,y)=>x+y,0)/sc.length).toFixed(1):"—";const strug=st.filter(s=>{const k=s.kt.find(k=>k.assignment_id===a.id);return k&&k.score!=null&&k.score<0.6*a.max;}).length;

     ${subs.map(s=>`<div style="border:1px solid var(--b1);border-radius:10px;padding:14px;margin-bottom:8px"><div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px"><span style="font-weight:600;font-size:14px">${esc(s.username)}</span><a href="${esc(s.url)}" target="_blank" class="mono" style="font-size:12px">${esc(s.assignment)}</a><span style="margin-left:auto" class="faint mono">${esc(s.status)}</span></div>
       <div style="display:grid;grid-template-columns:90px 170px 1fr auto;gap:8px;align-items:center">
         <input class="inp mono" id="sc_${s.student_id}_${s.assignment_id}" style="height:36px" placeholder="балл" value="${s.score!=null?s.score:""}">
         <select class="sel" id="stt_${s.student_id}_${s.assignment_id}" style="height:36px"><option value="accepted"${s.status==='accepted'?' selected':''}>принято</option><option value="revise"${s.status==='revise'?' selected':''}>на доработку</option><option value="submitted"${s.status==='submitted'?' selected':''}>сдано</option></select>
         <input class="inp" id="fb_${s.student_id}_${s.assignment_id}" style="height:36px" placeholder="фидбэк студенту" value="${esc(s.feedback||'')}">
         <button class="btn sm" onclick="gradeHw('${s.student_id}',${s.assignment_id})">Сохранить</button></div></div>`).join("")||empty("homework","Сдач на проверке нет — всё разобрано 🎉")}`;
  }).catch(()=>{$("aSubs").innerHTML='<div class="faint">Не удалось загрузить сдачи</div>';});
}

async function delPartner(id){if(!confirm("Удалить партнёра?"))return;await api("/api/admin/partners/"+id,{method:"DELETE"});_adm.partners=await api("/api/admin/partners").catch(()=>[]);_adm.roster=await api("/api/admin/roster").catch(()=>_adm.roster);toast("Партнёр удалён");paintAdm();}

async function delEvent(id){await api("/api/admin/calendar/"+id,{method:"DELETE"});_adm.cal=await api("/api/admin/calendar").catch(()=>[]);toast("Удалено");paintAdm();}
function admSignals(){
  const st=_adm.roster.students||[],cw=_adm.dash.week||0,sig=[];
  st.forEach(s=>{if(s.risk_note&&s.risk_note!=="watch")sig.push(["риск",s.username,esc(s.risk_note),"crit"]);
    const pct=100*(s.tokens||0)/25000000;if(pct>80)sig.push(["квота",s.username,"Израсходовано "+Math.round(pct)+"% недельной квоты","warn"]);

    if(s.week!=null&&cw&&s.week<cw-1)sig.push(["отставание",s.username,"Отстаёт на "+(cw-s.week)+" нед","warn"]);});
  aB(`<div class="card" style="margin-bottom:0"><div class="t18" style="margin-bottom:4px">Сигналы</div><div class="faint" style="margin-bottom:14px">Автоматические риски. Список read-only — действие в разделе, на который он ведёт.</div>
   ${sig.map(([tag,who,detail,k])=>{const[bg,fg]=CH[k==='crit'?'risk':'doing'];return `<div style="display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:${bg};margin-bottom:8px"><span class="chip" style="background:var(--bg1);color:${fg}">${tag}</span><div style="flex:1"><div style="font-size:13.5px;font-weight:500">${esc(who)}</div><div class="sub" style="font-size:12px">${detail}</div></div></div>`;}).join("")||'<div style="text-align:center;padding:30px" class="faint">Всё в норме · рисков нет 🎉</div>'}</div>`);
}
let _lecOpts="";

  aB(`<div class="card"><div class="t18" style="margin-bottom:14px">Файлы материалов</div>
     <div class="dz" id="matDz" role="button" tabindex="0">${ic('up',22,1.8,'var(--accent)')}<div style="font-size:13.5px;font-weight:500;margin-top:6px">Перетащите слайды и конспекты</div><div class="faint" style="margin-top:2px">Попадут в публичный бакет s3.engineer-ai.pro/materials</div><input type="file" id="matIn" multiple style="display:none"></div>

     <select class="sel" id="mw_${esc(m.name)}" style="height:32px;width:auto;min-width:180px"><option value="">— лекция —</option>${_lecOpts}</select>
     <button class="btn sm" onclick="attachMat('${esc(m.name)}','${esc(m.url)}')">Привязать</button>
     <button onclick="delMat('${esc(m.name)}')" style="border:0;background:none;color:var(--crit);font-size:12px;cursor:pointer;padding:4px">Удалить</button></div>`).join("")||empty("lectures","Материалов нет — перетащите слайды в зону выше.");
}

  $("lmList").className="";
  $("lmList").innerHTML=lm.map(m=>`<div style="display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--b1)">
     <span class="chip" style="background:var(--accent-bg);color:var(--accent)">нед ${m.week}</span>
     <a href="${esc(m.url)}" target="_blank" style="flex:1;font-size:13px">${esc(m.title)}</a>
     <span class="faint" style="font-size:11.5px">${esc(m.lecture||"")}</span>

async function matUpload(files){const msg=$("matMsg");for(const f of files){msg.textContent="Загрузка "+f.name+"…";try{const fd=new FormData();fd.append("file",f,f.name);const r=await fetch("/api/admin/material-upload",{method:"POST",headers:{Authorization:"Bearer "+TOKEN},body:fd});if(!r.ok)throw new Error("HTTP "+r.status);}catch(e){msg.textContent="Ошибка: "+e.message;return;}}toast("Материал загружен");msg.textContent="";refreshMat();}

async function admNotes(){aB(`<div class="card" style="margin-bottom:0"><div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px"><div class="t18">Заметки лектора</div><span class="faint mono" id="nState"></span></div><textarea class="ta" id="lnotes" rows="12" style="line-height:1.6" placeholder="Приватные заметки по группе — автосохранение"></textarea></div>`);

async function admAnnounce(){aB(`<div class="card"><div class="t18" style="margin-bottom:14px">Новый анонс</div><input class="inp" id="annT" placeholder="Заголовок" style="margin-bottom:10px"><textarea class="ta" id="annB" rows="3" placeholder="Текст анонса" style="margin-bottom:14px"></textarea><button class="btn primary" onclick="postAnn()">Опубликовать</button></div>

    <div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn" onclick="closeModal()">Отмена</button><button class="btn primary" id="mSubmit">${esc(cta)}</button></div></div></div>`;
  $("mSubmit").onclick=submit;
}

// ── drag-drop ──
function wireDrop(zone,input,onFiles){if(!zone)return;zone.onclick=()=>input.click();input.onchange=()=>{if(input.files.length)onFiles([...input.files]);};
  zone.ondragover=e=>{e.preventDefault();zone.classList.add("over");};zone.ondragleave=()=>zone.classList.remove("over");
  zone.ondrop=e=>{e.preventDefault();zone.classList.remove("over");if(e.dataTransfer.files.length)onFiles([...e.dataTransfer.files]);};}

$("btnGithub").onclick=()=>login("github");
