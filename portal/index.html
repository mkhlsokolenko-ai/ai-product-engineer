<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Product Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0B0F14; --bg-1:#121821; --bg-2:#1A222E; --bg-inset:#080B0F;
    --text-1:#E6EDF3; --text-2:#8B98A5; --text-3:#5C6975;
    --border-1:rgba(230,237,243,.09); --border-2:rgba(230,237,243,.16);
    --accent:#5B8CFF; --accent-hover:#7CA4FF; --accent-bg:rgba(91,140,255,.12); --accent-border:rgba(91,140,255,.35);
    --ok:#3FB950; --ok-bg:rgba(63,185,80,.12); --warn:#F5D90A; --warn-bg:rgba(245,217,10,.10); --crit:#FF4D4F;
    --font-ui:"Geist","Inter",system-ui,sans-serif; --font-mono:"JetBrains Mono",ui-monospace,monospace;
    --r-m:10px; --r-l:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg-0);color:var(--text-1);font:14px/1.55 var(--font-ui)}
  a{color:var(--accent);text-decoration:none} a:hover{color:var(--accent-hover)}
  .hidden{display:none!important}
  .mono{font-family:var(--font-mono)}
  /* login */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .lcard{background:var(--bg-1);border:1px solid var(--border-1);border-radius:var(--r-l);padding:32px;width:400px}
  .wordmark{font:600 15px var(--font-mono);color:var(--accent);text-align:center;letter-spacing:.02em}
  #login h1{font:600 19px var(--font-ui);text-align:center;margin:14px 0 4px}
  .sub{color:var(--text-2);text-align:center;font-size:13px;margin:0 0 22px}
  .divider{display:flex;align-items:center;gap:12px;color:var(--text-3);font-size:12px;margin:18px 0}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border-1)}
  /* nav */
  nav{display:flex;align-items:center;gap:20px;padding:0 24px;height:56px;border-bottom:1px solid var(--border-1);
    position:sticky;top:0;background:rgba(11,15,20,.9);backdrop-filter:blur(8px);z-index:10;flex-wrap:wrap}
  nav .brand{font:600 14px var(--font-mono);color:var(--accent)}
  .tabs{display:flex;gap:4px;flex:1;flex-wrap:wrap}
  .tab{padding:7px 12px;border-radius:8px;color:var(--text-2);cursor:pointer;font-weight:500;font-size:13.5px;background:none;border:none}
  .tab:hover{color:var(--text-1);background:var(--bg-1)}
  .tab.active{color:var(--accent);background:var(--accent-bg)}
  .who{font-size:12.5px;color:var(--text-2);display:flex;align-items:center;gap:10px}
  main{max-width:980px;margin:0 auto;padding:28px 24px 60px}
  h2{font:600 22px var(--font-ui);margin:0 0 18px}
  /* components */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;
    border-radius:var(--r-m);border:1px solid var(--border-2);background:var(--bg-2);color:var(--text-1);
    font:600 13.5px var(--font-ui);cursor:pointer;transition:.15s}
  .btn:hover{border-color:var(--accent-border);background:var(--accent-bg);color:var(--accent-hover)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff} .btn.primary:hover{background:var(--accent-hover)}
  .btn.sm{height:32px;padding:0 12px;font-size:12.5px}
  .card{background:var(--bg-1);border:1px solid var(--border-1);border-radius:var(--r-l);padding:20px;margin-bottom:14px}
  .grid{display:grid;gap:14px}
  .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
  @media(max-width:720px){.g3,.g2{grid-template-columns:1fr}}
  .caps{font:600 10.5px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
  .big{font:700 30px var(--font-mono);color:var(--accent)} .muted{color:var(--text-2)} .faint{color:var(--text-3)}
  .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-1);font-size:13.5px}
  .row:last-child{border:none}
  .bar{height:6px;border-radius:4px;background:var(--bg-inset);overflow:hidden;margin-top:8px} .bar>i{display:block;height:100%;background:var(--accent)}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font:600 11px var(--font-mono)}
  .b-blue{background:var(--accent-bg);color:var(--accent)} .b-ok{background:var(--ok-bg);color:var(--ok)} .b-warn{background:var(--warn-bg);color:var(--warn)}
  input,textarea,select{width:100%;background:var(--bg-inset);border:1px solid var(--border-2);border-radius:var(--r-m);
    padding:9px 12px;color:var(--text-1);font:13.5px var(--font-ui);outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--accent-border)}
  label{font-size:12px;color:var(--text-2);display:block;margin:10px 0 4px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border-1)} th{color:var(--text-2);font-weight:500;font-size:12px}
  .lecblock{font:600 10.5px var(--font-mono);color:var(--text-3);margin:18px 0 8px;letter-spacing:.06em}
  .foot{color:var(--text-3);font-size:11.5px;text-align:center;margin-top:20px}
  .errbar{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:var(--r-m);padding:10px 14px;margin-bottom:14px;font-size:12.5px}
  /* мобильная адаптация */
  @media(max-width:640px){
    nav{gap:8px;padding:8px 12px;height:auto;align-items:center}
    .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;order:3;width:100%;padding-bottom:2px}
    .tab{white-space:nowrap;padding:6px 10px}
    .brand{font-size:12.5px} .who{font-size:11px;gap:6px}
    main{padding:18px 14px 60px} h2{font-size:19px;margin-bottom:14px}
    .lcard{width:100%}
    table{font-size:12.5px} th,td{padding:7px 6px}
    .grid.g3,.grid.g2{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<!-- Логин -->
<div id="login" class="hidden">
  <div class="lcard">
    <div class="wordmark">engineer-ai.pro</div>
    <h1>AI Product Engineer</h1>
    <p class="sub">Соколенко М.В. · РУТ (МИИТ) · единый вход</p>
    <button class="btn" style="width:100%" id="btnGithub">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      Продолжить с GitHub</button>
    <div class="divider">или</div>
    <button class="btn" style="width:100%" id="btnLogin">Вход по логину</button>
    <p class="foot">Входя, ты соглашаешься с правилами курса.</p>
  </div>
</div>

<!-- Приложение -->
<div id="app" class="hidden">
  <nav>
    <span class="brand">engineer-ai.pro</span>
    <div class="tabs" id="tabs"></div>
    <span class="who"><span id="whoName"></span><span class="badge b-blue" id="whoRole">student</span>
      <button class="btn sm" id="btnLogout">Выйти</button></span>
  </nav>
  <main id="view"></main>
</div>

<script>
const KC="https://auth.engineer-ai.pro/realms/ai-product-engineer/protocol/openid-connect";
const CLIENT="portal", REDIRECT=location.origin+"/";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const fmtN=n=>n>=1e6?(n/1e6).toFixed(1)+"M":Number(n||0).toLocaleString("ru-RU");
const mb=b=>(b/1048576).toFixed(1);

// ── OIDC PKCE ──
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const rnd=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return b64(a)};
const chal=async v=>b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
const jwtp=t=>{try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))}catch{return{}}};
const expd=t=>{const p=jwtp(t);return !p.exp||p.exp*1000<Date.now()+5000};
let TOKEN=null, CLAIMS={}, ROLES=[];

async function login(idp){
  const v=rnd(48);sessionStorage.setItem('pkce',v);const st=rnd(16);sessionStorage.setItem('st',st);
  const p=new URLSearchParams({client_id:CLIENT,response_type:'code',scope:'openid',redirect_uri:REDIRECT,state:st,code_challenge:await chal(v),code_challenge_method:'S256'});
  if(idp)p.set('kc_idp_hint',idp);location.href=KC+"/auth?"+p;
}
async function exchange(code,st){
  if(st!==sessionStorage.getItem('st'))return showLogin();
  const body=new URLSearchParams({grant_type:'authorization_code',client_id:CLIENT,code,redirect_uri:REDIRECT,code_verifier:sessionStorage.getItem('pkce')||''});
  try{const r=await fetch(KC+"/token",{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});const d=await r.json();
    if(d.access_token){sessionStorage.setItem('tok',d.access_token);if(d.id_token)sessionStorage.setItem('idt',d.id_token);history.replaceState({},'',REDIRECT);boot(d.access_token);}else showLogin();
  }catch{showLogin()}
}
async function api(path,opts={}){
  const r=await fetch(path,{...opts,headers:{...(opts.headers||{}),Authorization:"Bearer "+TOKEN,...(opts.body?{'Content-Type':'application/json'}:{})}});
  if(!r.ok)throw new Error(r.status);return r.status===204?null:r.json();
}
function showLogin(){$("login").classList.remove("hidden");$("app").classList.add("hidden");}

// ── App shell ──
const TABS=[
  ["cabinet","Кабинет"],["project","Проект"],["lectures","Лекции"],["homework","Домашки"],["grades","Оценки"],["board","Лидерборд"],
];
const STAFF_TAB=["admin","Админка"];
let CUR="cabinet";

function boot(tok){
  TOKEN=tok;CLAIMS=jwtp(tok);ROLES=(CLAIMS.realm_access&&CLAIMS.realm_access.roles)||[];
  const staff=ROLES.includes("lecturer")||ROLES.includes("admin");
  $("whoName").textContent=CLAIMS.preferred_username||CLAIMS.name||"студент";
  $("whoRole").textContent=ROLES.includes("admin")?"admin":ROLES.includes("lecturer")?"lecturer":"student";
  const tabs=staff?[...TABS,STAFF_TAB]:TABS;
  $("tabs").innerHTML=tabs.map(([k,l])=>`<button class="tab" data-k="${k}">${l}</button>`).join("");
  $("tabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>go(b.dataset.k));
  $("login").classList.add("hidden");$("app").classList.remove("hidden");
  go("cabinet");
}
function go(k){CUR=k;$("tabs").querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.k===k));
  try{ ({cabinet:vCabinet,project:vProject,lectures:vLectures,homework:vHomework,grades:vGrades,board:vBoard,admin:vAdmin}[k]||vCabinet)(); }
  catch(e){ $("view").innerHTML='<div class="errbar">Ошибка отображения вкладки: '+esc(e.message)+'</div>'; }}
const view=h=>$("view").innerHTML=h;

// ── Views ──
async function vCabinet(){
  view(`<h2>Кабинет</h2><div id="c"></div>`);
  let u={},s={},p={};
  try{u=await api("/api/my-usage")}catch{} try{s=await api("/api/storage/my-files")}catch{} try{p=await api("/api/progress")}catch{}
  const wk=u.week||{};
  $("c").innerHTML=`
   <div class="grid g3">
     <div class="card"><div class="caps">Токены · неделя</div><div class="big">${fmtN(wk.tokens_used)}</div>
       <div class="muted">из ${fmtN(wk.limit)} · осталось ${fmtN(wk.remaining)}</div>
       <div class="bar"><i style="width:${Math.min(100,wk.used_pct||0)}%"></i></div></div>
     <div class="card"><div class="caps">Хранилище</div><div class="big">${mb(s.used_bytes||0)}<span style="font-size:14px"> МБ</span></div>
       <div class="muted">из ${mb(s.limit_bytes||629145600)} МБ</div>
       <div class="bar"><i style="width:${Math.min(100,s.used_pct||0)}%"></i></div></div>
     <div class="card"><div class="caps">Прогресс по домашкам</div><div class="big">${p.accepted||0}/${p.assignments_total||0}</div>
       <div class="muted">принято · сдано ${p.submitted||0}</div></div>
   </div>
   <div class="card"><div class="caps">Стоимость за неделю</div>
     <div class="row"><span class="muted">Потрачено</span><span class="mono">${(wk.cost_rub||0).toFixed(2)} ₽</span></div>
     <div class="row"><span class="muted">Вызовов</span><span class="mono">${wk.calls||0}</span></div>
     <div class="row"><span class="muted">Сессий на неделе</span><span class="mono">${(u.sessions_this_week||{}).opened||0} / ${(u.sessions_this_week||{}).limit||5}</span></div>
   </div>
   <p class="foot">Токены наполняются, когда работаешь через MCP-шлюз (OpenCode → mcp.engineer-ai.pro).</p>`;
}
async function vLectures(){
  view(`<h2>Лекции</h2><div id="l">Загрузка…</div>`);
  const ls=await api("/api/lectures").catch(()=>[]);
  let h="",blk=null;
  ls.forEach(x=>{ if(x.block!==blk){blk=x.block;h+=`<div class="lecblock">БЛОК ${blk}</div>`;}
    h+=`<div class="card"><div style="display:flex;gap:12px;align-items:baseline">
      <span class="badge b-blue">нед. ${x.week}</span><b>${esc(x.title)}</b></div>
      <div class="muted" style="margin-top:6px">${esc(x.topic)}</div>
      ${x.materials_url?`<div style="margin-top:8px"><a href="${esc(x.materials_url)}">Материалы →</a></div>`:""}</div>`;});
  $("l").innerHTML=h||"<div class='muted'>Пока пусто</div>";
}
async function vHomework(){
  view(`<h2>Домашние задания</h2><div id="h">Загрузка…</div>`);
  const [as,subs]=await Promise.all([api("/api/assignments").catch(()=>[]),api("/api/my/submissions").catch(()=>({}))]);
  const grades=await api("/api/my/grades").catch(()=>({}));
  $("h").innerHTML=as.map(a=>{
    const s=subs[a.id], g=grades[a.id];
    const st=s?(s.status==="accepted"?`<span class="badge b-ok">принято</span>`:s.status==="revise"?`<span class="badge b-warn">на доработку</span>`:`<span class="badge b-blue">сдано</span>`):`<span class="badge" style="background:var(--bg-2);color:var(--text-3)">не сдано</span>`;
    return `<div class="card">
      <div style="display:flex;gap:12px;align-items:baseline;flex-wrap:wrap">
        <span class="badge b-blue">нед. ${a.week}</span><b>${esc(a.title)}</b>
        <span class="faint mono">${a.fmt} · до ${a.max_score} б.</span><span style="margin-left:auto">${st}</span></div>
      <div class="muted" style="margin:8px 0">${esc(a.description)}</div>
      ${g&&g.score!=null?`<div class="card" style="background:var(--ok-bg);border-color:var(--ok);margin:8px 0">
         <b style="color:var(--ok)">Оценка: ${g.score} / ${a.max_score}</b>${g.feedback?`<div class="muted" style="margin-top:4px">${esc(g.feedback)}</div>`:""}</div>`:""}
      <label>Ссылка на сдачу (repo / PR / .md в репозитории)</label>
      <input id="u${a.id}" placeholder="https://github.com/..." value="${s?esc(s.url):""}">
      <label>Комментарий (необязательно)</label>
      <input id="n${a.id}" value="${s?esc(s.note):""}">
      <div style="margin-top:10px"><button class="btn primary sm" onclick="submitHw(${a.id})">${s?"Обновить сдачу":"Сдать"}</button></div>
    </div>`;}).join("")||"<div class='muted'>Пока пусто</div>";
}
async function submitHw(id){
  const url=$("u"+id).value.trim(); if(!url)return alert("Укажи ссылку на сдачу");
  await api("/api/my/submissions",{method:"POST",body:JSON.stringify({assignment_id:id,url,note:$("n"+id).value})});
  vHomework();
}
async function vGrades(){
  view(`<h2>Оценки</h2><div id="g">Загрузка…</div>`);
  const [as,grades]=await Promise.all([api("/api/assignments").catch(()=>[]),api("/api/my/grades").catch(()=>({}))]);
  let tot=0,max=0;
  const rows=as.map(a=>{const g=grades[a.id];if(g&&g.score!=null){tot+=Number(g.score);max+=a.max_score;}
    return `<tr><td>нед. ${a.week}</td><td>${esc(a.title)}</td><td class="mono">${g&&g.score!=null?g.score+" / "+a.max_score:"—"}</td><td class="muted">${g?esc(g.feedback||""):""}</td></tr>`;}).join("");
  $("g").innerHTML=`<div class="card"><div class="caps">Итого</div><div class="big">${tot} <span style="font-size:14px" class="muted">/ ${max||"—"}</span></div></div>
    <div class="card"><table><tr><th>Неделя</th><th>Задание</th><th>Оценка</th><th>Фидбэк</th></tr>${rows}</table></div>`;
}
async function vBoard(){
  view(`<h2>Лидерборд · неделя</h2><div id="b">Загрузка…</div>`);
  const rows=await api("/api/leaderboard").catch(()=>[]);
  $("b").innerHTML=`<div class="card"><table><tr><th>#</th><th>Студент</th><th>Токены</th><th>Стоимость</th></tr>
    ${rows.map((r,i)=>`<tr><td class="mono">${i+1}</td><td>${esc(r.username)}</td><td class="mono">${fmtN(r.tokens)}</td><td class="mono">${r.cost_rub.toFixed(2)} ₽</td></tr>`).join("")||`<tr><td colspan=4 class="muted">Пока нет данных</td></tr>`}</table></div>`;
}
async function vAdmin(){
  view(`<h2>Админка · проверка домашек</h2><div id="a">Загрузка…</div><h2 style="margin-top:28px">Расход по группе</h2><div id="cr"></div>`);
  const subs=await api("/api/admin/submissions").catch(()=>[]);
  $("a").innerHTML=subs.map(s=>`<div class="card">
     <div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap"><b>${esc(s.username)}</b>
       <span class="muted">${esc(s.assignment)}</span>
       <span class="badge ${s.status==='accepted'?'b-ok':s.status==='revise'?'b-warn':'b-blue'}">${esc(s.status)}</span>
       <a style="margin-left:auto" href="${esc(s.url)}" target="_blank">открыть сдачу →</a></div>
     ${s.note?`<div class="muted" style="margin-top:6px">${esc(s.note)}</div>`:""}
     <div class="grid g3" style="margin-top:10px">
       <div><label>Балл</label><input id="sc_${s.student_id}_${s.assignment_id}" type="number" value="${s.score!=null?s.score:""}"></div>
       <div><label>Статус</label><select id="stt_${s.student_id}_${s.assignment_id}">
         <option value="accepted"${s.status==='accepted'?' selected':''}>принято</option>
         <option value="revise"${s.status==='revise'?' selected':''}>на доработку</option>
         <option value="submitted"${s.status==='submitted'?' selected':''}>сдано</option></select></div>
       <div style="display:flex;align-items:flex-end"><button class="btn primary" style="width:100%" onclick="gradeHw('${s.student_id}',${s.assignment_id})">Сохранить</button></div>
     </div>
     <label>Фидбэк</label><input id="fb_${s.student_id}_${s.assignment_id}" value="${esc(s.feedback||'')}">
   </div>`).join("")||"<div class='muted'>Сдач пока нет</div>";
  const cr=await api("/api/admin/cost-report").catch(()=>({students:[]}));
  $("cr").innerHTML=`<div class="card"><table><tr><th>Студент</th><th>Токены</th><th>% недели</th><th>Стоимость</th><th>Сессий</th></tr>
    ${(cr.students||[]).map(x=>`<tr><td>${esc(x.username)}</td><td class="mono">${fmtN(x.tokens)}</td><td class="mono">${x.weekly_used_pct}%</td><td class="mono">${x.cost_rub.toFixed(2)} ₽</td><td class="mono">${x.sessions}</td></tr>`).join("")||`<tr><td colspan=5 class="muted">Нет данных</td></tr>`}</table></div>`;
}
async function gradeHw(sid,aid){
  const score=parseFloat($("sc_"+sid+"_"+aid).value);
  if(isNaN(score))return alert("Укажи балл");
  await api("/api/admin/grade",{method:"POST",body:JSON.stringify({student_id:sid,assignment_id:aid,score,status:$("stt_"+sid+"_"+aid).value,feedback:$("fb_"+sid+"_"+aid).value})});
  vAdmin();
}

async function vProject(){
  view(`<h2>Проект · файлы</h2><div id="p">Загрузка…</div>`);
  const s=await api("/api/storage/my-files").catch(()=>({files:[],used_bytes:0,limit_bytes:629145600,used_pct:0}));
  const files=s.files||[];
  $("p").innerHTML=`
    <div class="card"><div class="caps">Хранилище проекта</div>
      <div class="row"><span class="muted">Занято</span><span class="mono">${mb(s.used_bytes)} / ${mb(s.limit_bytes)} МБ</span></div>
      <div class="bar"><i style="width:${Math.min(100,s.used_pct||0)}%"></i></div>
      <div style="margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <input type="file" id="fileIn" style="flex:1;min-width:200px">
        <button class="btn primary" id="btnUp">Загрузить</button></div>
      <div class="faint" style="margin-top:6px">Документы (PDF/DOCX/MD), датасеты, артефакты. Лимит 600 МБ. Секреты/ПДн — нельзя.</div>
    </div>
    <div class="card"><table><tr><th>Файл</th><th>Размер</th><th></th></tr>
      ${files.map(f=>`<tr><td>${esc(f.name)}</td><td class="mono">${mb(f.size)} МБ</td>
        <td style="text-align:right"><a href="#" onclick="dlFile('${esc(f.name)}');return false">скачать</a> ·
          <a href="#" style="color:var(--crit)" onclick="delFile('${esc(f.name)}');return false">удалить</a></td></tr>`).join("")
        ||`<tr><td colspan=3 class="muted">Файлов пока нет</td></tr>`}</table></div>`;
  $("btnUp").onclick=uploadFile;
}
async function uploadFile(){
  const f=$("fileIn").files[0]; if(!f)return alert("Выбери файл");
  let r; try{ r=await api("/api/storage/upload-url?filename="+encodeURIComponent(f.name)+"&size="+f.size);}
  catch(e){return alert("Лимит хранилища исчерпан или ошибка");}
  try{ const put=await fetch(r.url,{method:"PUT",body:f}); if(!put.ok)throw new Error(put.status); vProject(); }
  catch(e){ alert("Не удалось загрузить. Проверь, что домен s3.engineer-ai.pro поднят (DNS). "+e); }
}
async function dlFile(name){ const r=await api("/api/storage/download-url?filename="+encodeURIComponent(name)); window.open(r.url,"_blank"); }
async function delFile(name){ if(!confirm("Удалить "+name+"?"))return; await api("/api/storage/file?filename="+encodeURIComponent(name),{method:"DELETE"}); vProject(); }

$("btnGithub").onclick=()=>login("github");
$("btnLogin").onclick=()=>login();
$("btnLogout").onclick=()=>{const idt=sessionStorage.getItem('idt');sessionStorage.clear();
  const p=new URLSearchParams({client_id:CLIENT,post_logout_redirect_uri:REDIRECT});if(idt)p.set('id_token_hint',idt);location.href=KC+"/logout?"+p;};

window.addEventListener('error',e=>{const a=$("app");if(a&&a.classList.contains('hidden')&&!$("login").classList.contains('hidden'))return;
  const v=$("view");if(v&&!v.innerHTML.trim())v.innerHTML='<div class="errbar">Ошибка: '+esc(e.message)+'</div>';});
(function(){try{
  const q=new URLSearchParams(location.search);
  if(q.get('code'))return exchange(q.get('code'),q.get('state'));
  let t=null;try{t=sessionStorage.getItem('tok')}catch(_){}
  if(t&&!expd(t))boot(t);else showLogin();
}catch(e){showLogin();}})();
</script>
