<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Product Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ── Светлая тема (EdTech, по умолчанию) ── */
  :root{
    --bg-0:#F1EFE8; --bg-1:#FFFFFF; --bg-2:#F7F6F3; --bg-inset:#F1EFE8;
    --text-1:#1A1A1A; --text-2:#5F5E5A; --text-3:#75736B;
    --border-1:rgba(0,0,0,.10); --border-2:rgba(0,0,0,.17);
    --accent:#534AB7; --accent-hover:#6157C9; --accent-bg:rgba(83,74,183,.09); --accent-border:rgba(83,74,183,.30);
    --ok:#3B6D11; --ok-bg:#EAF3DE; --warn:#854F0B; --warn-bg:#FAEEDA; --crit:#A32D2D; --crit-bg:#FCEBEB;
    --nav-bg:rgba(255,255,255,.86); --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
    --font-ui:"Geist","Inter",system-ui,sans-serif; --font-mono:"JetBrains Mono",ui-monospace,monospace;
    /* 4/8 спейсинг-шкала + токен-радиусы (design-direction/LUDA-аудит) */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
    --r-s:8px; --r-m:10px; --r-l:14px;
  }
  /* ── Тёмная тема (авто по системе, если не форсим светлую) ── */
  @media(prefers-color-scheme:dark){:root:not([data-theme=light]){
    --bg-0:#14171C; --bg-1:#1A1F27; --bg-2:#232A36; --bg-inset:#0E1116;
    --text-1:#E8EAED; --text-2:#A7B0BC; --text-3:#8A94A0;
    --border-1:rgba(255,255,255,.09); --border-2:rgba(255,255,255,.17);
    --accent:#8B82F0; --accent-hover:#A29BF5; --accent-bg:rgba(139,130,240,.15); --accent-border:rgba(139,130,240,.42);
    --ok:#7BC86B; --ok-bg:rgba(123,200,107,.15); --warn:#E5B567; --warn-bg:rgba(229,181,103,.15); --crit:#F0888B; --crit-bg:rgba(240,136,139,.15);
    --nav-bg:rgba(20,23,28,.86); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
  }}
  /* ── Тёмная тема (форс переключателем) ── */
  :root[data-theme=dark]{
    --bg-0:#14171C; --bg-1:#1A1F27; --bg-2:#232A36; --bg-inset:#0E1116;
    --text-1:#E8EAED; --text-2:#A7B0BC; --text-3:#8A94A0;
    --border-1:rgba(255,255,255,.09); --border-2:rgba(255,255,255,.17);
    --accent:#8B82F0; --accent-hover:#A29BF5; --accent-bg:rgba(139,130,240,.15); --accent-border:rgba(139,130,240,.42);
    --ok:#7BC86B; --ok-bg:rgba(123,200,107,.15); --warn:#E5B567; --warn-bg:rgba(229,181,103,.15); --crit:#F0888B; --crit-bg:rgba(240,136,139,.15);
    --nav-bg:rgba(20,23,28,.86); --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg-0);color:var(--text-1);font:14px/1.55 var(--font-ui)}
  a{color:var(--accent);text-decoration:none} a:hover{color:var(--accent-hover)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  .hidden{display:none!important}
  .mono{font-family:var(--font-mono)}
  /* login */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .lcard{background:var(--bg-1);border:1px solid var(--border-1);border-radius:var(--r-l);padding:32px;width:400px}
  .wordmark{font:600 15px var(--font-mono);color:var(--accent);text-align:center;letter-spacing:.02em}
  #login h1{font:600 19px var(--font-ui);text-align:center;margin:14px 0 4px}
  .sub{color:var(--text-2);text-align:center;font-size:13px;margin:0 0 22px}
  .divider{display:flex;align-items:center;gap:12px;color:var(--text-3);font-size:12px;margin:18px 0}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border-1)}
  /* топ-бар + левый сайдбар (EdTech workspace) */
  .topbar{display:flex;align-items:center;gap:14px;padding:0 20px;height:56px;border-bottom:1px solid var(--border-1);
    position:sticky;top:0;background:var(--nav-bg);backdrop-filter:blur(8px);z-index:30}
  .iconbtn{background:var(--bg-2);border:1px solid var(--border-2);color:var(--text-1);border-radius:8px;
    width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px}
  .iconbtn:hover{border-color:var(--accent-border);color:var(--accent)}
  .brand{font:600 14px var(--font-mono);color:var(--accent)}
  .shell{display:flex;align-items:flex-start;max-width:1200px;margin:0 auto}
  .side{width:216px;flex-shrink:0;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;
    padding:16px 10px;border-right:1px solid var(--border-1);display:flex;flex-direction:column;gap:2px;background:var(--bg-0)}
  .tab{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-s);color:var(--text-2);
    cursor:pointer;font-weight:500;font-size:13.5px;background:none;border:none;text-align:left;width:100%}
  .tab .ti{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
  .ic{display:block} .menubtn .ic,.iconbtn .ic{margin:0}
  .tab:hover{color:var(--text-1);background:var(--bg-2)}
  .tab.active{color:var(--accent);background:var(--accent-bg);font-weight:600}
  .who{font-size:12.5px;color:var(--text-2);display:flex;align-items:center;gap:10px}
  main{flex:1;min-width:0;max-width:900px;margin:0 auto;padding:28px 28px 60px}
  h2{font:600 22px var(--font-ui);margin:0 0 18px}
  /* components */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;
    border-radius:var(--r-m);border:1px solid var(--border-2);background:var(--bg-2);color:var(--text-1);
    font:600 13.5px var(--font-ui);cursor:pointer;transition:.15s}
  .btn:hover{border-color:var(--accent-border);background:var(--accent-bg);color:var(--accent-hover)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff} .btn.primary:hover{background:var(--accent-hover)}
  .btn.sm{height:32px;padding:0 12px;font-size:12.5px}
  .card{background:var(--bg-1);border:1px solid var(--border-1);border-radius:var(--r-l);padding:20px;margin-bottom:14px;box-shadow:var(--shadow)}
  /* чипы-пилюли статусов */
  .chip{display:inline-block;padding:2px 10px;border-radius:999px;font:600 11px var(--font-ui);white-space:nowrap}
  .chip.done{background:var(--ok-bg);color:var(--ok)} .chip.doing{background:var(--warn-bg);color:var(--warn)}
  .chip.todo{background:var(--bg-2);color:var(--text-2);border:1px solid var(--border-1)} .chip.risk{background:var(--crit-bg);color:var(--crit)}
  .chip.info{background:var(--accent-bg);color:var(--accent)}
  /* под-вкладки (командный центр) */
  .subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .subtab{padding:7px 13px;border-radius:8px;border:1px solid var(--border-1);background:var(--bg-1);color:var(--text-2);
    cursor:pointer;font:600 12.5px var(--font-ui)}
  .subtab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .subtab:not(.on):hover{border-color:var(--accent-border);color:var(--text-1)}
  /* метрики-плитки */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:18px}
  .tile{background:var(--bg-1);border:1px solid var(--border-1);border-radius:12px;padding:13px 15px;box-shadow:var(--shadow)}
  .tile .t-l{font-size:11.5px;color:var(--text-2)} .tile .t-v{font:600 23px/1.1 var(--font-mono);margin-top:5px}
  /* dropzone (drag-and-drop, паттерн LUDA) */
  .dropzone{border:1.5px dashed var(--border-2);border-radius:12px;padding:22px 16px;text-align:center;cursor:pointer;
    color:var(--text-2);background:var(--bg-2);transition:.13s}
  .dropzone:hover{border-color:var(--accent-border);color:var(--text-1)}
  .dropzone.over{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
  .dropzone .dz-ic{font-size:26px;display:block;margin-bottom:6px}
  /* inline-edit в таблице лектора */
  .ie{background:transparent;border:1px solid transparent;padding:4px 6px;border-radius:6px;width:100%;font:13px var(--font-ui);color:var(--text-1)}
  .ie:hover{border-color:var(--border-1)} .ie:focus{background:var(--bg-inset);border-color:var(--accent);outline:none}
  /* сигнал */
  .signal{display:flex;gap:11px;padding:12px 14px;background:var(--bg-1);border:1px solid var(--border-1);border-radius:10px;align-items:flex-start;box-shadow:var(--shadow)}
  .signal .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0}
  /* мини-таблица КТ (пилюли-баллы) */
  .kt{display:inline-block;min-width:26px;text-align:center;padding:2px 6px;border-radius:7px;font:600 11px var(--font-mono);margin-right:3px}
  /* модалка */
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
  .modal{background:var(--bg-1);border:1px solid var(--border-1);border-radius:14px;padding:22px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  .modal h2{font-size:18px;margin-bottom:14px}
  .fld{margin-bottom:12px} .fld label{display:block;font-size:12px;color:var(--text-2);margin-bottom:4px}
  .mact{display:flex;gap:8px;margin-top:16px}
  .grid{display:grid;gap:14px}
  .g3{grid-template-columns:repeat(3,1fr)} .g2{grid-template-columns:repeat(2,1fr)}
  @media(max-width:720px){.g3,.g2{grid-template-columns:1fr}}
  .caps{font:600 10.5px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
  .big{font:700 30px var(--font-mono);color:var(--accent)} .muted{color:var(--text-2)} .faint{color:var(--text-3)}
  .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border-1);font-size:13.5px}
  .row:last-child{border:none}
  .bar{height:6px;border-radius:4px;background:var(--bg-inset);overflow:hidden;margin-top:8px} .bar>i{display:block;height:100%;background:var(--accent)}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font:600 11px var(--font-mono)}
  .b-blue{background:var(--accent-bg);color:var(--accent)} .b-ok{background:var(--ok-bg);color:var(--ok)} .b-warn{background:var(--warn-bg);color:var(--warn)}
  input,textarea,select{width:100%;background:var(--bg-inset);border:1px solid var(--border-2);border-radius:var(--r-m);
    padding:9px 12px;color:var(--text-1);font:13.5px var(--font-ui);outline:none}
  input:focus,textarea:focus,select:focus{border-color:var(--accent-border)}
  label{font-size:12px;color:var(--text-2);display:block;margin:10px 0 4px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border-1)} th{color:var(--text-2);font-weight:500;font-size:12px}
  .lecblock{font:600 10.5px var(--font-mono);color:var(--text-3);margin:18px 0 8px;letter-spacing:.06em}
  .foot{color:var(--text-3);font-size:11.5px;text-align:center;margin-top:20px}
  .errbar{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:var(--r-m);padding:10px 14px;margin-bottom:14px;font-size:12.5px}
  .menubtn{display:none;background:var(--bg-2);border:1px solid var(--border-2);color:var(--text-1);border-radius:8px;
    width:34px;height:34px;font-size:16px;cursor:pointer}
  /* планшет: сайдбар уже */
  @media(max-width:900px){ .side{width:180px} main{padding:24px 20px 60px} }
  /* мобильная адаптация — сайдбар выпадающим меню */
  @media(max-width:720px){
    .menubtn{display:inline-flex;align-items:center;justify-content:center}
    .shell{display:block}
    .side{position:fixed;top:56px;left:0;right:0;width:auto;height:auto;max-height:72vh;
      border-right:none;border-bottom:1px solid var(--border-1);background:var(--bg-1);
      box-shadow:0 14px 28px rgba(0,0,0,.28);z-index:25;display:none;padding:8px}
    .side.open{display:flex}
    .tab{font-size:15px;padding:12px}
    main{padding:18px 14px 60px} h2{font-size:19px;margin-bottom:14px}
    .lcard{width:100%}
    table{font-size:12.5px} th,td{padding:7px 6px}
    .grid.g3,.grid.g2{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<!-- Логин -->
<div id="login" class="hidden">
  <div class="lcard">
    <div class="wordmark">engineer-ai.pro</div>
    <h1>AI Product Engineer</h1>
    <p class="sub">Соколенко М.В. · РУТ (МИИТ) · единый вход</p>
    <button class="btn primary" style="width:100%" id="btnGithub">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      Продолжить с GitHub</button>
    <div class="divider">или</div>
    <button class="btn" style="width:100%" id="btnLogin">Вход по логину</button>
    <p class="foot">Входя, ты соглашаешься с правилами курса.</p>
  </div>
</div>

<!-- Приложение -->
<div id="app" class="hidden">
  <header class="topbar">
    <button class="menubtn" id="menuBtn" aria-label="Меню разделов">☰</button>
    <span class="brand">engineer-ai.pro</span>
    <span style="flex:1"></span>
    <span class="who"><button class="iconbtn" id="btnTheme" aria-label="Сменить тему" title="Сменить тему">🌙</button>
      <span id="whoName"></span><span class="badge b-blue" id="whoRole">student</span>
      <button class="btn sm" id="btnLogout">Выйти</button></span>
  </header>
  <div class="shell">
    <nav class="side" id="tabs" aria-label="Разделы курса"></nav>
    <main id="view"></main>
  </div>
  <div id="modalHost"></div>
</div>

<script>
const KC="https://auth.engineer-ai.pro/realms/ai-product-engineer/protocol/openid-connect";
const CLIENT="portal", REDIRECT=location.origin+"/";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const fmtN=n=>n>=1e6?(n/1e6).toFixed(1)+"M":Number(n||0).toLocaleString("ru-RU");
const mb=b=>(b/1048576).toFixed(1);
const ragCollection=()=>"ape_stu_"+String((CLAIMS.preferred_username||CLAIMS.sub||"me")).toLowerCase().replace(/[^a-z0-9_]/g,"_").slice(0,32);
// ── Иконки (одноцветные векторные, lucide-стиль, currentColor) ──
const ICONS={
  home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
  lectures:'<path d="M21.4 10.9a1 1 0 0 0 0-1.8L12.8 5.2a2 2 0 0 0-1.6 0L2.6 9.1a1 1 0 0 0 0 1.8l8.6 3.9a2 2 0 0 0 1.6 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>',
  homework:'<rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>',
  project:'<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>',
  grades:'<path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
  community:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  cabinet:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  admin:'<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.9 4.9 1.4 1.4"/><path d="m17.7 17.7 1.4 1.4"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.3 17.7-1.4 1.4"/><path d="m19.1 4.9-1.4 1.4"/>',
  moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
  menu:'<path d="M4 12h16"/><path d="M4 6h16"/><path d="M4 18h16"/>',
  upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/>',
  copy:'<rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>'
};
const svg=(n,s=18)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||''}</svg>`;
// ── Тема (светлая по умолчанию, тёмная по переключателю/системе) ──
function curTheme(){const s=localStorage.getItem('theme');if(s)return s;
  return (window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light';}
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);
  const b=$("btnTheme");if(b)b.innerHTML=t==='dark'?svg('sun',17):svg('moon',17);}

// ── OIDC PKCE ──
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const rnd=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return b64(a)};
const chal=async v=>b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)));
const jwtp=t=>{try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))}catch{return{}}};
const expd=t=>{const p=jwtp(t);return !p.exp||p.exp*1000<Date.now()+5000};
let TOKEN=null, CLAIMS={}, ROLES=[];

async function login(idp){
  const v=rnd(48);sessionStorage.setItem('pkce',v);const st=rnd(16);sessionStorage.setItem('st',st);
  const p=new URLSearchParams({client_id:CLIENT,response_type:'code',scope:'openid',redirect_uri:REDIRECT,state:st,code_challenge:await chal(v),code_challenge_method:'S256'});
  if(idp)p.set('kc_idp_hint',idp);location.href=KC+"/auth?"+p;
}
async function exchange(code,st){
  if(st!==sessionStorage.getItem('st'))return showLogin();
  const body=new URLSearchParams({grant_type:'authorization_code',client_id:CLIENT,code,redirect_uri:REDIRECT,code_verifier:sessionStorage.getItem('pkce')||''});
  try{const r=await fetch(KC+"/token",{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});const d=await r.json();
    if(d.access_token){sessionStorage.setItem('tok',d.access_token);if(d.id_token)sessionStorage.setItem('idt',d.id_token);history.replaceState({},'',REDIRECT);boot(d.access_token);}else showLogin();
  }catch{showLogin()}
}
async function api(path,opts={}){
  const r=await fetch(path,{...opts,headers:{...(opts.headers||{}),Authorization:"Bearer "+TOKEN,...(opts.body?{'Content-Type':'application/json'}:{})}});
  if(!r.ok)throw new Error(r.status);return r.status===204?null:r.json();
}
function showLogin(){$("login").classList.remove("hidden");$("app").classList.add("hidden");}

function boot(tok){
  TOKEN=tok;CLAIMS=jwtp(tok);ROLES=(CLAIMS.realm_access&&CLAIMS.realm_access.roles)||[];
  const staff=ROLES.includes("lecturer")||ROLES.includes("admin");
  $("whoName").textContent=CLAIMS.preferred_username||CLAIMS.name||"студент";
  $("whoRole").textContent=ROLES.includes("admin")?"admin":ROLES.includes("lecturer")?"lecturer":"student";
  const tabs=staff?[...TABS,STAFF_TAB]:TABS;
  $("tabs").innerHTML=tabs.map(([k,l])=>`<button class="tab" data-k="${k}"><span class="ti">${svg(k)}</span>${l}</button>`).join("");
  $("tabs").querySelectorAll(".tab").forEach(b=>b.onclick=()=>go(b.dataset.k));
  $("menuBtn").innerHTML=svg('menu',18);
  $("menuBtn").onclick=()=>$("tabs").classList.toggle("open");
  $("login").classList.add("hidden");$("app").classList.remove("hidden");
  applyTheme(curTheme());
  go("home");
}

function leaderChart(board){
  const top=board.slice(0,8); if(!top.length)return '<div class="muted">Нет данных для графика</div>';
  const me=(CLAIMS.preferred_username||CLAIMS.name), max=Math.max(...top.map(r=>r.tokens),1);
  const rh=30, w=560, pad=112, bw=w-pad-40;
  const h=top.length*rh+10;
  const bars=top.map((r,i)=>{const y=i*rh+6, len=Math.max(3,Math.round(bw*r.tokens/max)), mine=r.username===me;
    return `<text x="0" y="${y+13}" font-size="12" fill="var(--text-2)" font-family="var(--font-ui)">${esc(r.username.slice(0,13))}</text>
      <rect x="${pad}" y="${y+2}" width="${len}" height="16" rx="4" fill="${mine?'var(--accent)':'var(--accent-border)'}"></rect>
      <text x="${pad+len+6}" y="${y+13}" font-size="11" fill="var(--text-3)" font-family="var(--font-mono)">${fmtN(r.tokens)}</text>`;}).join("");
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px;height:auto">${bars}</svg>`;
}

function wireDrop(zone,input,onFiles){ if(!zone)return;
  zone.onclick=()=>input.click(); input.onchange=()=>{if(input.files.length)onFiles([...input.files]);};
  zone.ondragover=e=>{e.preventDefault();zone.classList.add("over");};
  zone.ondragleave=()=>zone.classList.remove("over");
  zone.ondrop=e=>{e.preventDefault();zone.classList.remove("over");if(e.dataTransfer.files.length)onFiles([...e.dataTransfer.files]);};
}

         <span class="badge ${nd.days_left<=2?'b-warn':nd.days_left<=5?'b-blue':'b-ok'}">${nd.days_left<=0?'сегодня':'через '+nd.days_left+' дн'}</span></div>
         <div class="muted" style="margin-top:4px">неделя ${nd.week}</div>
         <div style="margin-top:10px"><a href="#" onclick="go('homework');return false">К заданиям →</a></div>`:`<div class="muted">Нет открытых дедлайнов 🎉</div>`}</div></div>
   <div class="card"><div class="caps">Достижения</div>
     <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:8px">
       ${(d.achievements||[]).map(a=>`<div style="text-align:center;opacity:${a.earned?1:.3};min-width:62px">
         <div style="font-size:28px">${a.earned?a.icon:"🔒"}</div><div class="faint" style="font-size:10.5px;margin-top:2px">${esc(a.title)}</div></div>`).join("")}</div></div>
   <div class="grid g2">
     <div class="card"><div class="caps">С чего начать</div>
       ${(d.onboarding||[]).map(o=>`<div class="row"><span>${o.done?"✅":"⬜"}&nbsp; ${esc(o.title)}</span>${o.done?'<span class="badge b-ok">готово</span>':''}</div>`).join("")}
       <div style="margin-top:8px"><a href="#" onclick="go('cabinet');return false">Инструкция по подключению →</a></div></div>
     <div class="card"><div class="caps">Анонсы</div>
       ${(d.announcements&&d.announcements.length)?d.announcements.map(a=>`<div style="padding:8px 0;border-bottom:1px solid var(--border-1)"><b>${esc(a.title)}</b><div class="muted">${esc(a.body)}</div></div>`).join(""):`<div class="muted">Пока нет анонсов</div>`}</div></div>`;
}

async function vProject(){
  view(`<h2>Мой проект</h2><div id="pj">Загрузка…</div>`);
  let pr={},s={},u={};
  try{pr=await api("/api/my/project")}catch{} try{s=await api("/api/storage/my-files")}catch{} try{u=await api("/api/my-usage")}catch{}
  const files=s.files||[], wk=(u.week||{});
  $("pj").innerHTML=`
   <div class="card"><div class="caps">Проект</div>
     <label>Ссылка на репозиторий</label><input id="prRepo" placeholder="https://github.com/..." value="${esc(pr.repo_url||"")}">
     <label>Краткое описание (одна фраза)</label><input id="prDesc" value="${esc(pr.description||"")}">
     <label>Статус</label><select id="prStatus">
       ${["idea","discovery","design","mvp","evals","defended"].map(x=>`<option${pr.status===x?" selected":""}>${x}</option>`).join("")}</select>
     <div style="margin-top:12px"><button class="btn primary sm" onclick="saveProject()">Сохранить</button>
       ${pr.repo_url?` <a class="btn sm" href="${esc(pr.repo_url)}" target="_blank" style="margin-left:6px">Открыть репозиторий →</a>`:""}</div>
   </div>
   <div class="grid g3">
     <div class="card"><div class="caps">Файлы</div><div class="big">${files.length}</div>
       <div class="muted">${mb(s.used_bytes||0)} / 600 МБ</div><div class="bar"><i style="width:${Math.min(100,s.used_pct||0)}%"></i></div></div>
     <div class="card"><div class="caps">RAG-коллекция</div><div class="mono" style="font-size:12.5px;color:var(--accent);word-break:break-all">${esc(ragCollection())}</div>
       <div class="muted" style="margin-top:8px">Индекс через MCP:<br>rag_index / rag_search</div></div>
     <div class="card"><div class="caps">Стоимость · неделя</div><div class="big">${(wk.cost_rub||0).toFixed(0)}<span style="font-size:14px"> ₽</span></div>
       <div class="muted">${fmtN(wk.tokens_used)} токенов</div></div>
     <div class="card"><div class="caps">Наблюдаемость</div><b>Langfuse</b><div class="muted" style="margin-top:6px">трейсы агента · скоро</div></div>
   </div>
   <div class="card"><div class="caps">Файлы проекта</div>
     <div class="dropzone" id="pjDrop"><span class="dz-ic">${svg('upload',26)}</span>Перетащи файлы сюда или нажми<br>
       <span class="faint">PDF/DOCX/MD, датасеты, артефакты · свободно ${mb(s.remaining_bytes!=null?s.remaining_bytes:629145600)} МБ · без секретов/ПДн</span>
       <input type="file" id="pjIn" multiple style="display:none"></div>
     <div id="pjMsg" class="faint" style="margin:8px 0"></div>
     <table>${files.map(f=>`<tr><td>${esc(f.name)}</td><td class="mono">${mb(f.size)} МБ</td>
       <td style="text-align:right"><a href="#" onclick="dlFile('${esc(f.name)}');return false">скачать</a> · <a href="#" style="color:var(--crit)" onclick="delFile('${esc(f.name)}');return false">удалить</a></td></tr>`).join("")||`<tr><td colspan=3 class="muted">Файлов нет</td></tr>`}</table>
   </div>`;
  wireDrop($("pjDrop"),$("pjIn"),pjUpload);
}
async function pjUpload(files){
  const msg=$("pjMsg");
  for(const f of files){
    if(f.size>600*1048576){msg.textContent=`«${f.name}» больше 600 МБ — пропущен`;continue;}
    msg.textContent="Загрузка "+f.name+"…";
    try{
      const r=await api("/api/storage/upload-url?filename="+encodeURIComponent(f.name)+"&size="+f.size);
      const put=await fetch(r.url,{method:"PUT",body:f}); if(!put.ok)throw new Error("S3 "+put.status);
    }catch(e){ msg.textContent=String(e).includes("413")||String(e).includes("400")?"Лимит хранилища исчерпан":"Ошибка загрузки: "+e; return; }
  }
  msg.textContent="Готово ✓"; vProject();
}
async function saveProject(){
  await api("/api/my/project",{method:"POST",body:JSON.stringify({repo_url:$("prRepo").value,description:$("prDesc").value,status:$("prStatus").value})});
  vProject();
}
async function dlFile(name){ const r=await api("/api/storage/download-url?filename="+encodeURIComponent(name)); window.open(r.url,"_blank"); }
async function delFile(name){ if(!confirm("Удалить "+name+"?"))return; await api("/api/storage/file?filename="+encodeURIComponent(name),{method:"DELETE"}); vProject(); }
function copyToken(){
  if(!TOKEN)return alert("Сначала войди");
  navigator.clipboard.writeText(TOKEN).then(
    ()=>alert("Токен скопирован. В OpenCode добавь заголовок:\nAuthorization: Bearer <вставь токен>\nПри 401 — вернись в Кабинет и скопируй заново."),
    ()=>prompt("Скопируй токен вручную:",TOKEN));
}

$("btnTheme").onclick=toggleTheme;
$("btnGithub").onclick=()=>login("github");
$("btnLogin").onclick=()=>login();
$("btnLogout").onclick=()=>{const idt=sessionStorage.getItem('idt');sessionStorage.clear();
  const p=new URLSearchParams({client_id:CLIENT,post_logout_redirect_uri:REDIRECT});if(idt)p.set('id_token_hint',idt);location.href=KC+"/logout?"+p;};

window.addEventListener('error',e=>{const a=$("app");if(a&&a.classList.contains('hidden')&&!$("login").classList.contains('hidden'))return;
  const v=$("view");if(v&&!v.innerHTML.trim())v.innerHTML='<div class="errbar">Ошибка: '+esc(e.message)+'</div>';});
(function(){try{
  const q=new URLSearchParams(location.search);
  if(q.get('code'))return exchange(q.get('code'),q.get('state'));
  let t=null;try{t=sessionStorage.getItem('tok')}catch(_){}
  if(t&&!expd(t))boot(t);else showLogin();
}catch(e){showLogin();}})();
</script>
